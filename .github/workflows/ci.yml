name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 类型检查
        run: npm run typecheck

      - name: 初始化本地数据库
        run: npx wrangler d1 execute update-hub-db --local --file=schema.sql

      - name: 启动 dev server
        run: |
          printf 'API_TOKEN=%s\n' "$API_TOKEN" > .dev.vars
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/api/health >/dev/null && exit 0
            sleep 2
          done
          echo "dev server 启动超时"; cat wrangler.log; exit 1
        env:
          API_TOKEN: uh_test_token

      - name: 冒烟测试
        env:
          BASE_URL: http://localhost:8787
          API_TOKEN: uh_test_token
        run: npm run test:smoke

      - name: 迁移脚本校验（旧 schema → 001 迁移）
        run: |
          npx wrangler d1 execute update-hub-db --local --file=test/reset.sql
          npx wrangler d1 execute update-hub-db --local --file=test/legacy_schema.sql
          npx wrangler d1 execute update-hub-db --local --file=migrations/001_schema_sync.sql
          npx wrangler d1 execute update-hub-db --local --command "SELECT (SELECT COUNT(*) FROM projects) AS projects, (SELECT COUNT(*) FROM api_tokens WHERE legacy_token IS NOT NULL) AS legacy_tokens"

      - name: 输出日志（失败时）
        if: failure()
        run: cat wrangler.log || true
