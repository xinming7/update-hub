name = "update-hub"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[vars]
# 部署后用 `wrangler secret put API_TOKEN` / `wrangler secret put DASHBOARD_PASSWORD`
# 设置真实凭据，不要写进本文件（更不要提交到公开仓库）。
#
# 可选变量：
# CORS_ORIGIN = "https://your-dashboard.example.com"      # 额外允许的跨域来源（默认只允许同源）
# PUBLIC_URL  = "https://update-hub.example.workers.dev"  # 邮件退订链接用的对外地址
#
# 可选 Secrets（每日汇总 Telegram 推送；不配置则不推送。若同时启用了
# apple-update-checker 的 daily-digest 工作流，请二选一，避免重复推送）：
# TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
#
# ⚠️ 安全提醒：未设置 DASHBOARD_PASSWORD 时，仪表盘及其数据接口对任何人开放。
# 公网部署请务必 `wrangler secret put DASHBOARD_PASSWORD`，并为上报方签发
# 最小权限 Token（Token 管理端点需要 admin scope）。

# 定时任务不用 Cloudflare cron：src/index.ts 只导出 fetch，没有 scheduled handler。
# 真正的定时来自 .github/workflows/cron.yml（GitHub Actions）→ POST /api/cron/trigger。
# 这里曾声明过 [triggers] crons，是死配置，且占账号 cron 配额导致 deploy 报错，已删除。

# database_id 为线上真实值（2026-10 起改为明文提交，见项目约定）。
# 该 ID 不是密钥，无法凭它访问数据；但它是账号内资源标识，如需重新脱敏请改回占位符。
[[d1_databases]]
binding = "DB"
database_name = "update-hub-db"
database_id = "8a2fcdb3-d4eb-4a27-9404-35d1d981fb25"
